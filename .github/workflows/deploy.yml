name: Deploy

# Production deploys only by manual dispatch, never automatically, so a merge
# cannot change what servant.bible serves without a deliberate step. The
# dispatch must select a release: a v* tag whose commit is on main (ADR 0009).
# A branch fails before checkout, and a tag that never reached main fails
# before anything is installed or deployed, so neither develop nor unreviewed
# branch code can reach production this way.
#
#   gh workflow run deploy.yml --ref v<version>
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Require a v* release tag
        run: |
          set -euo pipefail
          echo "Dispatched on ${GITHUB_REF} (${GITHUB_SHA})"
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "::error::Production deploys only from a v* release tag; this dispatch selected ${GITHUB_REF}. Run: gh workflow run deploy.yml --ref v<version>"
              exit 1 ;;
          esac

      # Pin the checkout to what the dispatch captured, so nothing that moves
      # between clicking Run and this step can change what is deployed. Full
      # history, so the next step can check the tag against main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # The Release Tag workflow only tags main, but anyone with push access
      # can push a v* tag by hand onto any commit. Only a commit that reached
      # main through a reviewed pull request may be deployed.
      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          commit="$(git rev-parse 'HEAD^{commit}')"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::${GITHUB_REF#refs/tags/} points at ${commit}, which is not on main. Tag the release commit on main."
            exit 1
          fi
          echo "ok: ${GITHUB_REF#refs/tags/} (${commit}) is on main"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This job deploys with NO --env flag, so the top-level [vars] block is
      # what reaches production. Fail loudly if its label ever drifts.
      - name: Assert production environment label
        run: |
          set -euo pipefail
          value="$(sed -n '/^\[vars\]/,/^\[/p' wrangler.toml | sed -n 's/^ENVIRONMENT *= *"\(.*\)"/\1/p')"
          echo "wrangler.toml top-level [vars] ENVIRONMENT = '$value'"
          if [ "$value" != "production" ]; then
            echo "::error file=wrangler.toml::top-level [vars] ENVIRONMENT must be \"production\" (got \"$value\")"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # The page credential and the cookie secret (ADR 0006, ADR 0007) are
      # three Worker secrets, set here from the repository secrets and nowhere
      # else. An empty value would deploy a gate that answers 503 to everyone,
      # so refuse before uploading anything.
      - name: Assert the page credential is present
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME_PRODUCTION }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD_PRODUCTION }}
          PAGE_COOKIE_SECRET: ${{ secrets.PAGE_COOKIE_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          for name in PAGE_USERNAME PAGE_PASSWORD PAGE_COOKIE_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name}_PRODUCTION is missing or empty; the page gate (ADR 0006, ADR 0007) needs it."
              exit 1
            fi
          done
          echo "Page credential and cookie secret present."

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v4
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME_PRODUCTION }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD_PRODUCTION }}
          PAGE_COOKIE_SECRET: ${{ secrets.PAGE_COOKIE_SECRET_PRODUCTION }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            PAGE_USERNAME
            PAGE_PASSWORD
            PAGE_COOKIE_SECRET
