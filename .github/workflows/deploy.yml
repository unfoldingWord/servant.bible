name: Deploy

# Production deploys only by manual dispatch, never automatically, so a merge
# cannot change what servant.bible serves without a deliberate step. The
# dispatch must be run from main: any other ref fails before checkout, so
# unreviewed branch code can never reach production this way.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref other than main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys only from main; this dispatch selected ${GITHUB_REF}."
            exit 1
          fi
          echo "Dispatched from main (${GITHUB_SHA})."

      # Pin the checkout to the commit the dispatch captured. `ref: main` would
      # re-resolve the branch here, so a merge between clicking Run and this step
      # would deploy a commit the operator never selected.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This job deploys with NO --env flag, so the top-level [vars] block is
      # what reaches production. Fail loudly if its label ever drifts.
      - name: Assert production environment label
        run: |
          set -euo pipefail
          value="$(sed -n '/^\[vars\]/,/^\[/p' wrangler.toml | sed -n 's/^ENVIRONMENT *= *"\(.*\)"/\1/p')"
          echo "wrangler.toml top-level [vars] ENVIRONMENT = '$value'"
          if [ "$value" != "production" ]; then
            echo "::error file=wrangler.toml::top-level [vars] ENVIRONMENT must be \"production\" (got \"$value\")"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # The page credential (ADR 0006) is two Worker secrets, set here from the
      # repository secrets and nowhere else. An empty value would deploy a gate
      # that answers 503 to everyone, so refuse before uploading anything.
      - name: Assert the page credential is present
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME_PRODUCTION }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD_PRODUCTION }}
        run: |
          set -euo pipefail
          for name in PAGE_USERNAME PAGE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name}_PRODUCTION is missing or empty; the page gate (ADR 0006) needs it."
              exit 1
            fi
          done
          echo "Page credential present."

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v4
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME_PRODUCTION }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD_PRODUCTION }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            PAGE_USERNAME
            PAGE_PASSWORD
