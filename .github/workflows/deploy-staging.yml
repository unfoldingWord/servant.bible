name: Deploy Staging

# Staging deploys automatically after CI passes on main (a merge). Never on a
# pull request: a PR cannot change what staging serves until it is merged.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The page credential (ADR 0006) is two Worker secrets, set here from the
      # repository secrets and nowhere else. An empty value would deploy a gate
      # that answers 503 to everyone, so refuse before uploading anything.
      - name: Assert the page credential is present
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME_STAGING }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD_STAGING }}
        run: |
          set -euo pipefail
          for name in PAGE_USERNAME PAGE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name}_STAGING is missing or empty; the page gate (ADR 0006) needs it."
              exit 1
            fi
          done
          echo "Page credential present."

      - name: Deploy to Staging
        uses: cloudflare/wrangler-action@v4
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME_STAGING }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD_STAGING }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          secrets: |
            PAGE_USERNAME
            PAGE_PASSWORD
