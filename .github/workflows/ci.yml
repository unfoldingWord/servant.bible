name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Branching model (ADR 0009): develop is the integration branch and staging
  # follows it; main is the release branch and production deploys from it.
  # main only ever receives develop (a release) or a hotfix/* branch. Any other
  # pull request into main is refused here, so a feature branch cannot skip
  # integration and staging.
  release-source:
    name: Release Source
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require develop or hotfix/* as the source of a pull request into main
        # The pull request's author picks the branch name, so it reaches the
        # script through env, never by interpolation: a crafted name cannot
        # run shell commands here.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Pull request into main from '${HEAD_REF}'"
          case "${HEAD_REF}" in
            develop|hotfix/*) echo "ok" ;;
            *)
              echo "::error::Pull requests into main must come from develop (a release) or hotfix/* (an emergency fix). Open this one against develop instead."
              exit 1 ;;
          esac

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two layers, no escape hatch: the production tree fails on any severity,
      # the full tree fails on high or critical.
      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Audit all dependencies (fail on high/critical)
        run: pnpm run audit:all

  lint:
    name: Lint
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Validate servers.json
        run: pnpm run validate:servers

  typecheck:
    name: Type Check
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run check

  test:
    name: Test
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  build:
    name: Build
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
