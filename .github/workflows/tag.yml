name: Release Tag

# After CI passes on main, tag the merged commit with the package.json version.
# Every pull request bumps the version (CLAUDE.md), so each merge gets a tag.
# A rerun on the same commit is a no-op. A tag that already exists on a
# different commit means a pull request merged without bumping the version:
# the job fails so the missed bump is visible, not silently untagged.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag main with package.json version
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create tag if missing
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          head="${{ github.event.workflow_run.head_sha }}"
          if existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")"; then
            if [ "${existing}" = "${head}" ]; then
              echo "${tag} already points at ${head}; nothing to do."
              exit 0
            fi
            echo "::error::${tag} already exists at ${existing}, but main is now at ${head}. A pull request merged without bumping package.json; bump it in a follow-up pull request."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "Created ${tag} at $(git rev-parse --short HEAD)"
