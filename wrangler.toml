# Servant.Bible router Worker. One Worker owns the apex (ADR 0003).
#
# The top-level config IS production: the Deploy workflow runs `wrangler deploy`
# with no `--env`. Staging is `[env.staging]`. Production answers on
# `servant.bible` and `www.servant.bible`, staging on `staging.servant.bible`,
# all as Workers Custom Domains (#11). The workers.dev names stay on as
# fallbacks for now; `workers_dev` must be explicit because declaring routes
# flips its default to false.
name = "servant-bible"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Custom Domains, created by `wrangler deploy` itself: the deploy replaces any
# conflicting DNS record for these names at the moment it attaches. The router
# answers `www.` with a 308 to the apex (ADR 0002), so www is attached here
# rather than redirected by a dashboard rule.
routes = [
  { pattern = "servant.bible", custom_domain = true },
  { pattern = "www.servant.bible", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"

# The page credential (ADR 0006), PAGE_USERNAME and PAGE_PASSWORD, is a pair of
# Worker secrets that the deploy workflows set from GitHub repository secrets.
# It never appears here: a value in [vars] would be committed, and a missing
# one makes the page fail closed (503), never open.

# The generated page (#9) is served from here. `run_worker_first` means the
# Worker sees every request and decides when to hand one to the asset layer,
# so routing lives in one place (ADR 0003, decision 4).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Backends that are Workers on this account are reached by service binding
# (ADR 0003, decision 8). The platform refuses a Worker's public fetch to
# another Worker on the same account (error 1042), so these are required, not
# an optimisation. The `binding` name is what a servers.json version names;
# `service` is the Worker's name on the account. Keep [env.staging] in step.
[[services]]
binding = "TC_HELPS_V2"
service = "translation-helps-mcp-v2"

[[services]]
binding = "OBS_5M"
service = "obs-5m-mcp"

[[services]]
binding = "FIA"
service = "fia-mcp"

# ──── Staging environment ────
[env.staging]
name = "servant-bible-staging"
workers_dev = true

# `routes` is inheritable: without its own, staging would inherit the
# production domains above and the staging deploy would try to take the apex.
# tests/node/wrangler-config.test.ts pins which names each deployment owns.
routes = [{ pattern = "staging.servant.bible", custom_domain = true }]

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[env.staging.services]]
binding = "TC_HELPS_V2"
service = "translation-helps-mcp-v2"

[[env.staging.services]]
binding = "OBS_5M"
service = "obs-5m-mcp"

[[env.staging.services]]
binding = "FIA"
service = "fia-mcp"
